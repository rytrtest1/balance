    const act = actOverride || current.activity, action = actionOverride || current.action;
    // singleItem actions (Livre, Podcast, Sudoku vidéo, Parfum livre/vidéo…) also
    // carry a persistent "current title" in items[] (see resolveSingleItem) —
    // folded into this same call rather than a second round-trip, since it needs
    // the same comment as input. Naming a NEW title never reaches here — that's
    // the ephemeral "choisir" input (submitItemName), not a commented session, so
    // action.fresh is never true at this point. Only question left for Claude:
    // item_done=true clears the slot so the next draw re-opens "nouveau X".
    const singleItem = !!action.singleItem;
    const label = action.itemLabel || "titre";
    const curItem = singleItem && action.itemId ? (act.items || []).find((it) => it.id === action.itemId) : null;
    // progress (page/épisode/chapitre…) lives in its own field, never folded into
    // `text` itself — a page number typed straight into the title just goes stale
    // as it's re-read later (Maxence 02/08, caught on the parfum livre item).
    const itemCtx = !singleItem || !curItem ? "" : `\nCette activité suit aussi un ${label} "en cours" persistant, distinct des observations. ${label[0].toUpperCase()}${label.slice(1)} en cours : « ${curItem.text} »${curItem.progress ? ` (repère de progression actuel : ${curItem.progress})` : ""}.`;
    // self-healing titles (Maxence 02/08): some titles were typed once with a stray
    // progress marker baked in (e.g. "livre X, page 22/117") before `progress` existed
    // as its own field — there's no in-app rename UI, so instead of asking for a manual
    // fix, every session touching that item is a chance for Claude to notice and clean
    // it, same call as the progress extraction above.
    const titleCleanupCtx = curItem ? `\n\nSi « ${curItem.text} » contient encore un repère de progression collé au nom (numéro de page, épisode, %...) qui aurait dû être séparé, renvoie le titre nettoyé (sans ce repère, juste le nom) dans clean_title, et mets le repère qu'il contenait dans progress s'il n'y est pas déjà. Sinon clean_title = null (ne renomme jamais un titre déjà propre).` : "";
    const prompt = `Activité : « ${act.name} » (type: ${act.kind}, domaine: ${act.domain}).
Action faite : « ${current.action.text} ».
${itemCtx}

Mécanique de l'activité (fixe — règles, contraintes, structure ; sert de contexte, ne la modifie jamais) :
"""
${act.note || "(vide)"}
"""

Le champ « observations » est une MÉMOIRE qui s'accumule : patterns, ce qui marche, tendances repérées au fil des sessions — distincte de la mécanique ci-dessus.

Observations actuelles :
"""
${act.observations || "(vide)"}
"""

Commentaire laissé après cette session :
« ${text} »

Réécris les observations en y intégrant ce qu'apporte ce commentaire — garde tout ce qui reste pertinent, ne raccourcis pas artificiellement pour économiser de la place. Ne retire que ce qui est vraiment obsolète ou remplacé par une observation plus récente. updated_observations = les observations complètes réécrites.${curItem ? `\n\nDétermine aussi si « ${curItem.text} » est ENTIÈREMENT fini — le ${label} dans son ensemble, pas juste cette séance ni un épisode/chapitre particulier (la prochaine session en proposera un nouveau ${label}) : item_done = true UNIQUEMENT si le commentaire dit clairement que la totalité du ${label} est terminée (ex: "fini le podcast", "dernier épisode de la série", "j'ai fini le livre"). Un commentaire qui parle juste de cette séance ou d'un épisode/chapitre précis SANS dire que l'ensemble est fini ne compte PAS comme terminé : item_done = false par défaut dans le doute.\n\nSi le commentaire mentionne un repère de progression (page, épisode, chapitre, minute…), donne-le dans progress — court (ex: "p.22/117", "ép.6"), JAMAIS intégré au titre lui-même qui reste stable. progress = null si aucun repère n'est mentionné cette fois (garde alors l'ancien tel quel, ne l'efface pas).${titleCleanupCtx}` : ""}`;
    setSyncing(true); setSyncMsg("lecture du commentaire…");
    try {
      // maxTokens generous here (found 10/07: the default 400 truncates mid-JSON
      // once observations grow past a paragraph, JSON.parse then throws). Set well
      // above any size seen in practice — the API cost of the extra headroom is
      // negligible, so there's no reason to keep this tight.
      const out = await claudeJSON(key, prompt, {
        type: "object",
        properties: {
          updated_observations: { type: "string" },
          ...(curItem ? { item_done: { type: "boolean" }, progress: { type: ["string", "null"] }, clean_title: { type: ["string", "null"] } } : {}),
        },
        required: curItem ? ["updated_observations", "item_done", "progress", "clean_title"] : ["updated_observations"],
        additionalProperties: false,
      }, 4000);
      const aid = act.id;
      setActivities((arr) => arr.map((a) => {
        if (a.id !== aid) return a;
        const patch = { observations: out.updated_observations };
        if (curItem) patch.items = (a.items || []).map((it) => (it.id === curItem.id ? { ...it, done: !!out.item_done, progress: out.progress || it.progress || null, text: out.clean_title || it.text } : it));
        return { ...a, ...patch };
      }));
      setSyncMsg("observations mises à jour ✓");
    } catch (err) {
      setSyncMsg("lecture impossible (" + (err.message || "erreur") + ") — commentaire gardé");
    } finally {
      setSyncing(false);
      setTimeout(() => { setSyncMsg(""); finishFlow(text); }, 2400);
    }
  };

  const submitComment = async () => {
    const text = comment.trim();
    const parsedManual = manualMin.trim() ? parseInt(manualMin) : null;
    const existing = log.find((en) => en.id === doneEntryId);
    // cross-activity misfile fix (Maxence 06/08, Karen Gilbert incident): the engine
    // draws blind, so a singleItem session can land on the wrong action (Parfum vidéo
    // drawn while actually listening to the Podcast) — the comment then gets attached
    // to the wrong title. Since singleItem titles here are stored "lowercase title -
    // Capitalized Author" by convention, any capitalized token from the comment that
    // matches a token in ANOTHER tracked title (and only that one — ambiguous matches
    // are left alone) is confident enough to reroute the whole entry before anything
    // downstream (log fields, Claude context) reads it.
    let act = current && current.activity, action = current && current.action;
    if (text && action && action.singleItem) {
      const candidates = [];
      activities.forEach((a) => {
        (a.items || []).forEach((it) => {
          if (it.done || !it.actionId) return;
          if (a.id === act.id && it.actionId === action.id) return;
          const owner = (a.actions || []).find((x) => x.id === it.actionId);
          if (!owner || !owner.singleItem) return;
          const tokens = it.text.match(/\b[A-ZÀ-Ý][\wÀ-ÿ'-]{2,}\b/g) || [];
          const hit = tokens.some((tok) => new RegExp(`\\b${tok.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")}\\b`, "i").test(text));
          if (hit) candidates.push({ activity: a, action: owner, item: it });
        });
      });
      if (candidates.length === 1) {
        const c = candidates[0];
        act = c.activity; action = { ...c.action, itemId: c.item.id };
        setLog((L) => L.map((en) => (en.id === doneEntryId
          ? { ...en, activityId: act.id, actionId: action.id, actionText: action.text, domain: act.domain, itemId: c.item.id }
          : en)));
      }
    }
    const kind = act && act.kind;
    const isRecoWithItem = kind === "recommandeur" && !!action.itemId;
    // parfum — une des 3 évaluations à l'aveugle du jour (voir pickAging) : chips +
    // intensité choisies sur l'écran "done" atterrissent sur le log entry lui-même
    // (comme rating pour un recommandeur ci-dessous), plus une trace compacte sur
    // l'item (voir plus bas) pour retrouver l'historique d'une matière sans rescanner
    // tout le log.
    const isParfumMatiere = act && act.id === "a_parfum_explo" && action.id === "x_pf_matiere" && !!action.itemId;
    // vs — comparaison répétée à chaque round (16/08 v2, voir pickAging).
    // pfamPair/pfamRoundId posés par pickAging au tirage, pas ici.
    const isParfumDirectCmp = act && act.id === "a_parfum_explo" && action.id === "x_pf_direct_cmp" && !!action.pfamPair;
    if (doneEntryId) {
      setLog((L) => L.map((en) => {
        if (en.id !== doneEntryId) return en;
        const patch = {};
        if (parsedManual > 0) { patch.min = parsedManual; patch.sec = parsedManual * 60; }
        if (text) patch.note = text;
        if (isRecoWithItem) patch.rating = rating;
        if (isParfumMatiere) { patch.chips = parfumChips; patch.grades = parfumGrades; patch.intensity = parfumIntensity; patch.hedo = parfumHedo; patch.cortege = parfumCortege; patch.voisines = parfumVoisines; patch.diffusion = parfumDiffusion; patch.nettete = parfumNettete; patch.dosage = parfumDosage; patch.recall = parfumRecall; }
        if (isParfumDirectCmp) { patch.pfamFamily = action.pfamFamily; patch.pfamPair = action.pfamPair; patch.pfamRound = action.pfamRoundId; patch.pfamVs = parfumVs; }
        return { ...en, ...patch };
      }));
    }
    // finish() already advanced the clock by the logged minutes — only apply the
    // extra delta here if a manual override changes the duration after the fact.
    if (SIM && parsedManual > 0 && existing) {
      const delta = parsedManual - (existing.min || 0);
      if (delta) simAdvanceMinutes(delta);
    }
    // recommandeur (with a drawn item): keep the PRECISE rating, no liked/neutral/
    // disliked bucketing (Maxence 16/07, round 3 — "garder la note précise... quand
    // besoin d'interpréter, la note est utile couplée au commentaire texte", i.e. the
    // interpretation happens later by reading rating+comment together, not by the app
    // collapsing the number into a 3-way label now). `rating` lands on the item itself
    // (not just the log entry) so it's still there next time this item comes up in
    // conversation/curation. `status` only tracks in-rotation vs already-experienced —
    // "doing" → "done" removes it from the LRU candidate pool (hasDoingItems/
    // pickItemLRU only ever check for "doing", any other value works the same way).
    if (isRecoWithItem) {
      const aid = current.activity.id, itemId = current.action.itemId;
      setActivities((arr) => arr.map((a) => (a.id === aid
        ? { ...a, items: (a.items || []).map((it) => (it.id === itemId ? { ...it, status: "done", rating } : it)) }
        : a)));
    }
    if (isParfumMatiere) {
      const itemId = action.itemId;
      const roundId = action.parfumRound;
      // dès qu'il note une matière d'un round donné, il est déjà dessus — plus
      // besoin du rappel de CE round (sinon il sonnerait pour rien plus tard).
      if (roundId === "m30") cancelReminder("parfum_m30");
      if (roundId === "h2") cancelReminder("parfum_h2");
      if (roundId === "h6") cancelReminder("parfum_h6");
      setActivities((arr) => arr.map((a) => (a.id !== "a_parfum_explo" ? a : {
        ...a,
        items: (a.items || []).map((it) => (it.id !== itemId ? it : {
          ...it,
          // ts (08/08) : `date` seul ne sépare pas deux cycles d'une même matière
          // revenue en révision — parfumDernierMot a besoin de borner sur le cycle
          // en cours (prepTs), donc d'un horodatage réel. realNow(), jamais
          // Date.now() : le sandbox décale l'horloge.
          sessions: [...(it.sessions || []), { date: todayKey(), ts: realNow().getTime(), round: roundId, chips: parfumChips, grades: parfumGrades, intensity: parfumIntensity, hedo: parfumHedo, cortege: parfumCortege, voisines: parfumVoisines, diffusion: parfumDiffusion, nettete: parfumNettete, dosage: parfumDosage, recall: parfumRecall, note: text }],
        })),
        // avance le curseur checkpoint × matière (voir PARFUM_ROUNDS/pickAging) — la
        // 2e note d'un round (paire, 15/08) fait passer au round suivant, doneInRound repart à 0.
        pf3: a.pf3 ? (a.pf3.doneInRound + 1 >= 2
          ? { ...a.pf3, round: a.pf3.round + 1, doneInRound: 0 }
          : { ...a.pf3, doneInRound: a.pf3.doneInRound + 1 }) : a.pf3,
      })));
    }
    if (isParfumDirectCmp) {
      // écrit sur LES DEUX matières, symétrique — les notes ajustées dans le vs
      // (16/08 v2) VALENT désormais la note du round, patchées directement sur la
      // session déjà loggée (pas un jugement à part comme l'ancien a/b) : le vs
      // n'ajoute pas une couche de données, il affine celle qui existe déjà, côte à
      // côte. pfamCompares garde son rôle d'amortissement (voir pickItemsLRU),
      // plus de champ cmp dessus — la vraie source du "qui montre plus" est
      // maintenant les grades des deux sessions elles-mêmes.
      const [pa, pb] = action.pfamPair;
      const roundId = action.pfamRoundId;
      const lastRoundIdx = (sessions) => {
        for (let i = (sessions || []).length - 1; i >= 0; i--) if (sessions[i].round === roundId) return i;
        return -1;
      };
      const patchSession = (sess, side) => {
        const newGrades = { ...sess.grades };
        for (const f in (parfumVs.facets || {})) {
          const v = parfumVs.facets[f][side];
          if (v != null) newGrades[f] = v;
        }
        const newIntensity = parfumVs.intensity && parfumVs.intensity[side] != null ? parfumVs.intensity[side] : sess.intensity;
        return { ...sess, grades: newGrades, intensity: newIntensity };
      };
      const stamp = { date: todayKey(), ts: realNow().getTime(), family: action.pfamFamily, round: roundId };
      setActivities((arr) => arr.map((a) => (a.id !== "a_parfum_explo" ? a : {
        ...a,
        items: (a.items || []).map((it) => {
          if (it.id === pa.id) {
            const idx = lastRoundIdx(it.sessions);
            const sessions = idx < 0 ? it.sessions : it.sessions.map((s, i) => (i === idx ? patchSession(s, "a") : s));
            return { ...it, sessions, pfamCompares: [...(it.pfamCompares || []), { ...stamp, against: pb.id, otherNum: pb.num, otherName: pb.name }] };
          }
          if (it.id === pb.id) {
            const idx = lastRoundIdx(it.sessions);
            const sessions = idx < 0 ? it.sessions : it.sessions.map((s, i) => (i === idx ? patchSession(s, "b") : s));
            return { ...it, sessions, pfamCompares: [...(it.pfamCompares || []), { ...stamp, against: pa.id, otherNum: pa.num, otherName: pa.name }] };
          }
          return it;
        }),
        pf3: a.pf3 ? { ...a.pf3, cmpUpTo: a.pf3.cmpUpTo + 1 } : a.pf3,
      })));
    }
    // pipeline advances the piece, practice grows observations — recommandeur (with a
    // drawn item, or without) already has everything it needs synchronously above
    // (rating+status, or just log.note): no Claude round-trip for it (24/07 — removed
    // recoNoteViaClaude, which only ever distilled a comment that was already fully
    // captured in log.note verbatim, and was never read back anywhere in the app).
    const wantsClaude = !!text && (kind === "pipeline" || kind === "practice");
    if (wantsClaude) {
      const key = (await store.get("tlx_apiKey")) || "";
      if (key) { kind === "pipeline" ? advanceViaClaude(key, text) : coachViaClaude(key, text, act, action); return; }
      setSyncMsg(kind === "pipeline" ? "pas de clé API — commentaire gardé, pièce/observations non mises à jour" : "pas de clé API — commentaire gardé, observations non mises à jour");
      setTimeout(() => { setSyncMsg(""); finishFlow(text); }, 2200);
      return;
    }
    // task, or any recommandeur draw: no Claude round-trip, but still show the same
    // brief loading chip as pipeline/practice so submitting a comment reads
    // identically everywhere (Maxence 16/07 — écoute felt broken without it).
    if (text) {
      setSyncing(true); setSyncMsg("commentaire enregistré…");
      setTimeout(() => { setSyncing(false); setSyncMsg(""); finishFlow(text); }, 700);
      return;
    }
    finishFlow(text);
  };

  // mid-session comment (Maxence 16/07, round 8): Enter while running logs the
  // thought right away and clears the field, so several can go out over one
  // session — same "note" shape as the album titles (isDone/isClick skip it, it's
  // not a completion). Ending the session is still only the line tap (finish());
  // the field stays open afterward on "done" for a last word, untouched by this.
  const submitRunningComment = () => {
    const text = comment.trim();
    if (!text || !current) return;
    setLog((L) => [...L, {
      id: uid(), date: todayKey(), ts: realNow().getTime(), type: "note",
      activityId: current.activity.id, actionId: current.action.id, actionText: current.action.text,
      note: text,
    }]);
    setComment("");
    setRunNoteMsg("noté");
    setTimeout(() => setRunNoteMsg(""), 1600);
  };

  // section navigation — no tab bar; swipe left/right or tap the faint edge arrows.
  // prod is a single screen — the line. The activities editor lives in the sandbox
  // only now (13/07); the catalogue is edited in the files directly, not in-app.
  const TABS = SIM ? ["now", "liste", "simulateur", "activities"] : ["now"];
  const go = (dir) => {
    const i = TABS.indexOf(tab);
    const ni = Math.min(TABS.length - 1, Math.max(0, i + dir));
    if (ni === i) return;
    // Fixed 12/07 (Maxence): this used to call resetFlow() on arriving back at
    // "now", which silently wiped a running/awaiting-comment session — swiping to
    // "activities" and back was a free, unpenalised skip that bypassed the hold-
    // to-swap cost entirely. The flow state is already restored from tlx_flow on
    // reload; a same-session tab switch needs no reset at all.
    const t = TABS[ni]; setTab(t);
  };
  const touchRef = useRef(null);
  const onTouchStart = (e) => { const t = e.touches[0]; touchRef.current = { x: t.clientX, y: t.clientY }; };
  const onTouchEnd = (e) => {
    const s = touchRef.current; touchRef.current = null; if (!s) return;
    const t = e.changedTouches[0]; const dx = t.clientX - s.x, dy = t.clientY - s.y;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
  };

  // parfum prep/reveal ack — flips the one flag on pf.pf3 and moves straight to
  // the next forced card (see pickAging); no session, no log entry. Mutates the
  // activity object in place (same reference trick as pickAging's seedTs) so the
  // immediately-following propose() sees the flag already set even though
  // setActivities' own re-render hasn't landed yet.
  const ackParfum = async (flag) => {
    const pf = activities.find((a) => a.id === "a_parfum_explo");
    if (pf && pf.pf3) {
      pf.pf3[flag] = true;
      if (flag === "prepAcked") {
        pf.pf3.prepTs = realNow().getTime();
        // best-effort nudges pour légers (+30min), transition (+2h) et fond (+6h) —
        // le forçage dans pickAging reste le vrai filet, la notif n'est qu'un rappel
        // (Maxence 07/08 : rien pour l'ouverture — déjà en train de le faire — ni
        // pour le rappel J+1 — tombe au réveil, c'est le premier pick du lendemain).
        // Les trois `await` sont nécessaires : scheduleReminder fait un
        // read-modify-write sur le même tableau (tlx_reminder) — des appels non
        // séquentiels se marchent dessus et le dernier écrase les précédents (piège
        // déjà documenté au-dessus, sur readReminders).
        const label = PARFUM_BLIND ? pf.pf3.nums.map((n) => `#${n}`).join(" · ") : pf.pf3.names.join(" · ");
        const blindSuffix = PARFUM_BLIND ? " à l'aveugle" : "";
        await scheduleReminder(`parfum — légers : reviens noter ${label}${blindSuffix}`, 30, "parfum_m30");
        await scheduleReminder(`parfum — transition : reviens noter ${label}${blindSuffix}`, 120, "parfum_h2");
        await scheduleReminder(`parfum — fond : reviens noter ${label}${blindSuffix}`, 360, "parfum_h6");
      }
      setActivities((arr) => [...arr]);
    }
    propose();
  };
  // discard un tirage pas encore préparé (09/08, voir swap ci-dessus) — rien n'a
  // été fait dans la vraie vie (pas de mouillette), donc rien à défaire côté
  // matières : juste effacer pf3 pour qu'un prochain forçage retire proprement
  // via pickItemsLRU (qui, depuis le fix du même jour, ne remontrera pas ces
  // 3-là tout de suite puisqu'elles viennent d'être vues). avoidId évite que ce
  // même forçage revienne à l'instant sur le tour suivant.
  const discardParfum = () => {
    const pf = activities.find((a) => a.id === "a_parfum_explo");
    if (pf) { pf.pf3 = null; setActivities((arr) => [...arr]); }
    propose(log, activities, false, "a_parfum_explo");
  };
  // couleur (16/08-i) — validation de la carte x_pf_couleur : écrit `color` {h,s}
  // sur l'item (marqueur de plus dans la base, jamais un jugement olfactif) et
  // avance le cycle ; la 2e matière colorée pose revealed → le prochain forçage
  // retire une paire fraîche. skip=true (swipe, ou teinte jamais touchée) = pas de
  // couleur écrite, le cycle avance pareil. Même mutation en place + setActivities
  // ([...arr]) que ackParfum : le propose() qui suit doit voir l'état à jour.
  const submitParfumColor = (skip) => {
    const pf = activities.find((a) => a.id === "a_parfum_explo");
    const itemId = current?.action?.itemId;
    if (pf && pf.pf3 && itemId) {
      pf.pf3.colored = [...(pf.pf3.colored || []), itemId];
      if (pf.pf3.colored.length >= (pf.pf3.order || []).length) pf.pf3.revealed = true;
      if (!skip && parfumColorH != null) {
        const it = (pf.items || []).find((x) => x.id === itemId);
        if (it) it.color = { h: parfumColorH, s: parfumColorS ?? 70 };
      }
      setActivities((arr) => [...arr]);
    }
    setParfumColorH(null); setParfumColorS(null); setParfumColorPhase("hue");
    propose();
  };
  // parfum — soumission des 3 réponses (carte "avant de savoir"). Ce n'est pas une
  // session : rien dans le log, aucun clic compté, exactement comme prep/reveal.
  // Deux effets, tous les deux invisibles pour lui sur le moment :
  //  - la réponse est gardée sur l'item (`trials`), à côté du brut des 4 checkpoints ;
  //  - elle fixe la PROCHAINE échéance de cette matière (voir parfumNextInterval) :
  //    reconnue → on espace, ratée → on rapproche. C'est ça qui fait de la révision
  //    un vrai apprentissage et pas un défilé.
  // Laisser une case vide est un cas normal, pas une erreur : aucune réponse = aucun
  // signal, l'échéance ne change pas (ou part de la base si c'est la 1re fois) —
  // il n'est jamais puni d'avoir séché. Rien de tout ça n'est affiché : l'écran
  // suivant met sa réponse et la vraie côte à côte, il juge lui-même.
  const submitParfumGuess = () => {
    const pf = activities.find((a) => a.id === "a_parfum_explo");
    if (!pf || !pf.pf3) return;
    const guesses = [0, 1].map((i) => (parfumGuesses[i] || "").trim());
    const ts = realNow().getTime();
    setActivities((arr) => arr.map((a) => (a.id !== "a_parfum_explo" ? a : {
      ...a,
      items: (a.items || []).map((it) => {
        const i = pf.pf3.order.indexOf(it.id);
        if (i < 0) return it;
        const g = guesses[i];
        const hit = g ? parfumHit(g, it.text) : null;
        const interval = hit === null ? (it.interval || PARFUM_REVIEW_BASE_DAYS) : parfumNextInterval(it.interval, hit);
        return { ...it,
          trials: [...(it.trials || []), { ts, guess: g, hit }],
          interval,
          due: daysAgoKey(-interval) };
      }),
    })));
    // même mutation en place que ackParfum : le propose() qui suit doit voir le flag
    // avant que le re-render de setActivities n'ait atterri.
    pf.pf3.guesses = guesses;
    pf.pf3.guessed = true;
    setParfumGuesses(["", ""]);
    propose();
  };

  // tap to begin — for timed activities the line pre-fills with already-done minutes this period
  const begin = () => {
    // med reminder card (see start()): never a real session — move straight to
    // an actual proposal instead, nothing logged, no click counted.
    if (current?.medReminder) { propose(); return; }
    // singleItem "choisir" step: not a session either — naming happens via the
    // input below (submitItemName), a tap or the auto-start timer here is a no-op
    // until a title's been given and current.action.fresh has cleared.
    if (current?.action?.fresh) return;
    // parfum — cartes prep/reveal (voir pickAging) : pas une session, même idiome
    // que medReminder ci-dessus — un tap acquitte et repasse directement à la
    // suite (3e slot noté → reveal ; reveal lu → tirage du lendemain), jamais de
    // running/finish, donc jamais de clic compté.
    if (current?.action?.parfumPrep) { ackParfum("prepAcked"); return; }
    // couleur : le tap sur la ligne héro ne fait rien — c'est la mini-ligne de la
    // carte qui pilote (teinte → saturation → garder), voir le JSX parfumColor.
    if (current?.action?.parfumColor) return;
    // "avant de savoir" : même logique que l'étape "choisir" ci-dessus — le tap et
    // l'auto-start ne font rien, ce sont les champs sous la ligne qui avancent.
    if (current?.action?.parfumGuess) return;
    lastStartDelayRef.current = proposedAtRef.current ? Date.now() - proposedAtRef.current : null;
    let preMs = 0;
    if (current?.activity?.timed) {
      const done = minutesInPeriod(log, current.activity.id, null, current.activity.period || "day");
      preMs = Math.min(done, current.activity.target || 30) * 60000;
    }
    setStartedAt(Date.now() - preMs);
    setElapsedMs(preMs);
    setManualMin("");
    setPaused(false);
    pauseCountRef.current = 0;
    pausedMsRef.current = 0;
    if (LINE_MODE === "tilt") sessionTiltRef.current = domainBalance(activities, log);
    // Album de la semaine: seed the one always-present empty slot (see albumTitles doc).
    setAlbumTitles(isAlbumActivity ? [{ id: uid(), text: "", rating: 50 }] : []);
    setAlbumIdx(0);
    setRunning(true); setStage("running");
    // renforce l'autoplay : play() directement dans ce vrai tap utilisateur, en
    // plus de l'effect stage/paused (certains WebView Android sont plus stricts
    // que Chrome desktop sur ce qui compte comme "déclenché par un tap").
    try { silentAudioRef.current?.play?.()?.catch(() => {}); } catch (e) {}
  };

  // singleItem "choisir" step: typed title becomes the item directly (no Claude
  // round-trip — it's already exact text, not something to infer from a comment).
  // Swaps current.action to the real resolved action in place, stage stays
  // "proposal" so the existing tap/AUTO_START_MS path takes it from here exactly
  // like any normal proposal — no separate "now start the session" call needed.
  const submitItemName = () => {
    const title = itemNameInput.trim();
    if (!title || !current?.action?.fresh) return;
    const { activity: a, action } = current;
    // current.action is already the RESOLVED fresh proposal (text carries the
    // "— nouveau X" suffix) — resolveSingleItem needs the pristine action from
    // a.actions to build the real "— « titre »" text from, not double-suffix it.
    const baseAction = (a.actions || []).find((x) => x.id === action.id) || action;
    const newItem = { id: uid(), text: title, done: false, actionId: action.id };
    const nextItems = [...(a.items || []), newItem];
    setActivities((arr) => arr.map((act) => (act.id === a.id ? { ...act, items: nextItems } : act)));
    setCurrent({ activity: { ...a, items: nextItems }, action: resolveSingleItem({ ...a, items: nextItems }, baseAction) });
    setItemNameInput("");
  };

  // auto-start (Maxence 16/07): a proposal used to need its own separate tap before
  // running started — one click too many for "yes, this". Now it begins on its own
  // after a short beat, no tap needed; pause/resume already covers "not right now".
  // Paused while `holding` (the hold-to-swap gesture, still the way to reject a
  // proposal) so the two never race — effHold starts at 10s and doubles per swap
  // that day, always far longer than this delay, but auto-start firing mid-hold
  // would yank the line out from under an in-progress swap. An aborted hold (let go
  // before the swap threshold) restarts the countdown fresh rather than resuming it.
  // rappel des facettes du round précédent (16/08-i, Maxence : "au début de chaque
  // round on remontre les facettes sélectionnées précédemment avec le slider associé
  // en mémoire, on modifie si besoin"). Préremplit chips/grades depuis la DERNIÈRE
  // session de CE cycle (ts >= prepTs — jamais un vieux cycle) dès que la carte d'un
  // round > ouverture est proposée ; ne touche à rien si des chips sont déjà là
  // (resetFlow nettoie entre deux propositions, donc non-vide = déjà prérempli ou
  // déjà édité ce tour-ci). L'ouverture part toujours vierge.
  useEffect(() => {
    const a = current && current.activity, act = current && current.action;
    if (!a || a.id !== "a_parfum_explo" || !act || act.id !== "x_pf_matiere" || !act.itemId) return;
    if (act.parfumRound === "direct" || parfumChips.length) return;
    const it = (a.items || []).find((x) => x.id === act.itemId);
    const prepTs = a.pf3 && a.pf3.prepTs;
    if (!it || !prepTs) return;
    const cyc = (it.sessions || []).filter((s) => (s.ts || 0) >= prepTs);
    const prev = cyc[cyc.length - 1];
    if (prev && prev.chips && prev.chips.length) {
      setParfumChips(prev.chips);
      setParfumGrades(prev.grades || {});
    }
  }, [current]);
  const AUTO_START_MS = 2200;
  useEffect(() => {
    if (stage !== "proposal" || holding) return;
    // exception parfum (08/08, trouvé en jouant le cycle complet dans le bac à
    // sable) : prep / "avant de savoir" / révélé ne sont pas des propositions de
    // séance mais des consignes à exécuter physiquement et un retour à lire.
    // L'auto-start les escamotait en 2,2s — la carte de prépa posait prepTs et
    // programmait les rappels +2h/+6h avant même qu'il ait sorti les flacons, et
    // la révélation (sa réponse, la vraie matière, son mot du cycle précédent)
    // disparaissait sans être lue. Elles attendent donc un vrai tap. `fresh`
    // (l'étape "choisir") est déjà un no-op dans begin(), listée ici pour ne plus
    // armer un timer pour rien.
    const act = current && current.action;
    if (act && (act.parfumPrep || act.parfumGuess || act.parfumColor || act.fresh)) return;
    const t = setTimeout(() => { begin(); }, AUTO_START_MS);
    return () => clearTimeout(t);
  }, [stage, current, holding]);

  // tap "done" — log real time (or manual override), trigger vaisselle if cooking done
  const finish = () => {
    if (!current) { resetFlow(); return; }
    // SIM: real elapsed time is meaningless for a hand-run test (tapping through fast) —
    // default to the activity/action's catalogue duration instead, so the sandbox clock
    // (advanced below) reflects a plausible session length; the "done" screen still lets
    // Maxence type an explicit override, which submitComment() applies as a delta on top.
    // Prod (SIM=false) is untouched: it always logs the real elapsed duration.
    const minLogged = SIM
      ? Math.max(1, Math.round(actDurMin))
      : Math.max(1, Math.round(Math.max(1, Math.round((Date.now() - startedAt) / 1000)) / 60));
    const aid = current.activity.id;
    setLastId(aid);
    const e = {
      // realNow() not Date.now(): identical in prod (no debug clock), but in the
      // sandbox this must track the simulated clock (see comment on the fix below).
      id: uid(), date: todayKey(), ts: realNow().getTime(), type: "done",
      activityId: aid, actionId: current.action.id, actionText: current.action.text,
      min: minLogged, sec: minLogged * 60, domain: current.activity.domain, note: "",
      ...(current.action.itemId ? { itemId: current.action.itemId } : {}),
      ...(lastStartDelayRef.current != null ? { startDelayMs: lastStartDelayRef.current } : {}),
      ...(pauseCountRef.current > 0 ? { pauseCount: pauseCountRef.current, pausedMs: pausedMsRef.current } : {}),
    };
    if (current.activity.kind === "task") {
      setActivities((arr) => arr.map((a) => (a.id === aid ? { ...a, done: true } : a)));
    }
    if (current.action.deferredReminder) {
      scheduleReminder(current.action.deferredReminder.text, current.action.deferredReminder.afterMin);
    }
    // undo snapshot — see pipelineUndoRef declaration. Taken here, before any
    // funnel move exists, so undoLast() can restore it whether or not
    // advanceViaClaude has run yet by the time "annuler" is tapped.
    if (current.activity.kind === "pipeline") {
      const other = current.activity.graduatesTo ? activities.find((a) => a.id === current.activity.graduatesTo) : null;
      pipelineUndoRef.current = {
        entryId: e.id, aid,
        prevItems: current.activity.items || [],

        prevGraduateItems: other ? (other.items || []) : null,
      };
    } else {
      pipelineUndoRef.current = null;
    }

    // Album de la semaine (item 5): each title noted during the session gets its own
    // log entry too, type "note" so isDone/isClick/minutesInPeriod never see it — these
    // are stats-only, additive to the one real completion `e` above, never a second
    // completion of the album itself.
    const notedTitles = albumTitles.filter((t) => t.text && t.text.trim());
    const titleEntries = (aid === "a_ecoute_album" && notedTitles.length)
      ? notedTitles.map((t) => ({
          id: uid(), date: todayKey(), ts: realNow().getTime(), type: "note",
          activityId: aid, parentId: e.id, titleText: t.text.trim(), rating: t.rating,
          note: `titre : ${t.text.trim()}`,
        }))
      : [];
    setLog((L) => [...L, e, ...titleEntries]);
    setAlbumTitles([]); setAlbumIdx(0); setRating(50);
    // sandbox clock: advance right away by the catalogue default duration, so it
    // already reflects a plausible length before any override is typed — tapping
    // the line on "done" (submitComment) applies the delta if one is.
    if (SIM) simAdvanceMinutes(minLogged);
    setRunning(false);
    // comment NOT cleared here (fixed 16/07): finish() used to always blank it before
    // "done" ever showed, harmless back when the field only existed on "done" — now
    // that it's also open during "running" (see the effect above), clearing it here
    // would silently throw away whatever was typed mid-session.
    setManualMin(""); setDescOpen(false);
    setStage("done");
  };

  // ----- the line is the whole control surface: short tap acts, long hold retracts & re-picks -----
  const tapAction = () => {
    if (stage === "entry") start();
    // tapping the line from "done" submits whatever's in the duration/comment fields
    // (same as the old "passer"/"valider" button) then moves on — one control surface,
    // no separate button needed.
    else if (stage === "done") submitComment();
    else if (stage === "proposal") begin();
    else if (stage === "running" && !paused) {
      // album de la semaine: a plain tap on the hero line commits the current
      // title and opens the next slot — the same action Enter already did on
      // the title field (Maxence 20/07: tap-the-line is the one surface used
      // for every other "move on" gesture in the app, Enter-only was easy to
      // miss and broke that idiom). Falls through to a normal finish() the
      // moment there's nothing left to advance — the trailing slot is empty,
      // meaning "I'm done listening", not "one more title" — same guard
      // advanceAlbumTitle already uses for a no-op swipe.
      const albumHasNext = isAlbumActivity && (albumIdx < albumTitles.length - 1 || (albumTitles[albumIdx] && albumTitles[albumIdx].text.trim()));
      if (albumHasNext) advanceAlbumTitle(1);
      else finish(); // resume before finishing — paused time shouldn't count
    }
  };
  // hold-to-skip is the one control surface for "not this" — it has to stay available
  // for the whole life of a session, not just before it starts (Maxence 17/07: was
  // gated to "proposal" only, so holding mid-session or on the trailing comment screen
  // silently fell through to the plain tap action — finish()/submitComment() firing
  // instead of the retract-and-skip gesture the user expects everywhere else).
  const canHold = stage === "proposal" || stage === "running" || stage === "done";
  const effHold = holdDate === todayKey() ? holdMs : BASE_HOLD_MS; // ignore a stale day if left open past midnight
  // hero-line-as-rating-slider (16/07-d, revised 20/07): on "done", for ANY
  // recommandeur action (single item or the album's own final verdict — see
  // `rating` state above), the main line reads drag vs tap: a real drag adjusts
  // the rating live (same centre-out magnitude read as setAlbumRatingFromPointer),
  // a plain tap (down/up with no meaningful travel) submits — same gesture the
  // line uses everywhere else, just re-purposed here instead of being dead while
  // ratingActive. Tapping again to "confirm" used to jump the rating to wherever
  // that second tap landed instead (Maxence 20/07) since the old code set the
  // rating unconditionally on pointer-down, before it could know the gesture
  // would turn out to be a tap and not a drag.
  const ratingActive = stage === "done" && current && current.activity.kind === "recommandeur";
  const setRatingFromPointer = (clientX) => {
    const el = lineRef.current;
    if (!el || clientX == null) return;
    const rect = el.getBoundingClientRect();
    const half = rect.width / 2 || 1;
    const r = Math.round(Math.max(0, Math.min(1, Math.abs(clientX - (rect.left + half)) / half)) * 100);
    setRating(r);
  };
  // couleur de matière (16/08-i, revu même jour — Maxence : "on utilise la ligne
  // principale comme slider et pas la peine de mettre la ligne en couleur, seulement
  // le nom de la matière, on comprendra intuitivement") — même ligne héro que
  // ratingActive, drag vs tap, mais lecture GAUCHE→DROITE (position, pas magnitude
  // centre-out : une teinte/saturation n'a pas de "zéro au milieu") et deux phases
  // séquentielles (teinte puis saturation) sur le même geste plutôt qu'un seul axe.
  const colorActive = stage === "proposal" && current?.action?.parfumColor;
  const setColorFromPointer = (clientX) => {
    const el = lineRef.current;
    if (!el || clientX == null) return;
    const rect = el.getBoundingClientRect();
    const frac = Math.max(0, Math.min(1, (clientX - rect.left) / (rect.width || 1)));
    if (parfumColorPhase === "hue") setParfumColorH(Math.round(frac * 360));
    else setParfumColorS(Math.round(frac * 100));
  };
  // mesures/facettes du parfum sur la ligne héro (16/08-k, Maxence : "pourquoi on
  // n'utilise pas la ligne principale pour toutes ces mesures ! c'est stupide de
  // dupliquer" — plus de PfLine séparée, voir ParfumNotePicker/ParfumVsPicker).
  // Même ligne que ratingActive : drag = pose la valeur (magnitude centre-out
  // 0-100). Tap (16/08-m, retour en arrière assumé — Maxence : "une fois noté en
  // drag et la ligne tapée une fois on met agrément etc") = AVANCE dans la
  // séquence (mesures puis facettes, voir pfSeq), plus de submit immédiat au
  // milieu du parcours ; les points sous la ligne restent un raccourci pour
  // sauter directement à un élément ("au cas où"), pas la navigation principale.
  // Une fois la séquence entièrement parcourue (parfumMIdx >= pfSeq.length),
  // pfCur devient null → pfMeasureActive false → la ligne retombe sur son
  // comportement "done" normal, tap = submitComment(). Pas de clamp sur pfCur
  // (contrairement au mIdx affiché côté ParfumNotePicker, qui lui clampe pour
  // l'affichage) : c'est précisément le fait de sortir de l'intervalle qui
  // signale "fini".
  const pfShowMesures = current?.action?.parfumRound === "direct";
  const pfFull = current?.action?.parfumRound === "direct" || current?.action?.parfumRound === "final";
  const pfMesures = (current && current.action.id === "x_pf_matiere" && current.action.itemId) ? [
    { kind: "mesure", key: "intensité", val: parfumIntensity, set: setParfumIntensity },
    { kind: "mesure", key: "agrément", val: parfumHedo, set: setParfumHedo },
    ...(pfShowMesures ? [
      { kind: "mesure", key: "diffusion", val: parfumDiffusion, set: setParfumDiffusion },
      { kind: "mesure", key: "netteté", val: parfumNettete, set: setParfumNettete },
    ] : []),
    { kind: "mesure", key: "cortège", val: parfumCortege, set: setParfumCortege },
    ...(pfFull ? [{ kind: "mesure", key: "dosage", val: parfumDosage, set: setParfumDosage }] : []),
  ] : [];
  const pfSeq = pfMesures.length ? [
    ...pfMesures,
    ...parfumChips.map((w) => ({ kind: "facette", key: w, val: parfumGrades[w] ?? null, set: (v) => setParfumGrades((g) => ({ ...g, [w]: v })) })),
  ] : [];
  const pfCur = (pfSeq.length && parfumMIdx < pfSeq.length) ? pfSeq[parfumMIdx] : null;
  const pfMeasureActive = stage === "done" && !!pfCur;
  const pfMeasureVal = pfCur ? pfCur.val : null;
  const setPfMeasureFromPointer = (clientX) => {
    const el = lineRef.current;
    if (!el || clientX == null || !pfCur) return;
    const rect = el.getBoundingClientRect();
    const half = rect.width / 2 || 1;
    const v = Math.round(Math.max(0, Math.min(1, Math.abs(clientX - (rect.left + half)) / half)) * 100);
    pfCur.set(v);
  };
  // vs (x_pf_direct_cmp) — même ligne, double jauge (voir le JSX de remplissage
  // plus bas) : l'active se drag comme pfMeasureActive, l'autre matière reste
  // visible en repères gris derrière, toujours (voir le fix du bug 16/08-j).
  const pfVsPair = (current?.action?.id === "x_pf_direct_cmp" && current.action.pfamPair) ? current.action.pfamPair : null;
  const pfVsRoundId = pfVsPair ? current.action.pfamRoundId : null;
  const pfVsLastSess = (itemId) => {
    const it = (current.activity.items || []).find((x) => x.id === itemId);
    return ((it && it.sessions) || []).filter((s) => s.round === pfVsRoundId).slice(-1)[0];
  };
  const pfVsSessA = pfVsPair ? pfVsLastSess(pfVsPair[0].id) : null;
  const pfVsSessB = pfVsPair ? pfVsLastSess(pfVsPair[1].id) : null;
  const pfVsSeq = (pfVsSessA && pfVsSessB) ? [
    ...(pfVsSessA.intensity != null || pfVsSessB.intensity != null ? [{ key: "__int", label: "intensité" }] : []),
    ...((pfVsSessA.chips || Object.keys(pfVsSessA.grades || {})).filter((f) => (pfVsSessB.chips || Object.keys(pfVsSessB.grades || {})).includes(f))).map((f) => ({ key: f, label: f })),
  ] : [];
  // pas de clamp (16/08-n, même principe que pfMesures/pfCur) : sortir de
  // l'intervalle est le signal "séquence épuisée", géré par onLineUp.
  const pfVsCur = (pfVsSeq.length && parfumVIdx < pfVsSeq.length) ? pfVsSeq[parfumVIdx] : null;
  const pfVsSide = pfVsCur ? (parfumVsActive[pfVsCur.key] || "a") : "a";
  const pfVsVal = (side) => {
    if (!pfVsCur) return null;
    return pfVsCur.key === "__int"
      ? (parfumVs.intensity?.[side] ?? (side === "a" ? pfVsSessA.intensity : pfVsSessB.intensity) ?? null)
      : (parfumVs.facets?.[pfVsCur.key]?.[side] ?? (side === "a" ? pfVsSessA.grades?.[pfVsCur.key] : pfVsSessB.grades?.[pfVsCur.key]) ?? null);
  };
  const pfVsHeroActive = stage === "done" && !!pfVsCur;
  const setPfVsFromPointer = (clientX) => {
    const el = lineRef.current;
    if (!el || clientX == null || !pfVsCur) return;
    const rect = el.getBoundingClientRect();
    const half = rect.width / 2 || 1;
    const v = Math.round(Math.max(0, Math.min(1, Math.abs(clientX - (rect.left + half)) / half)) * 100);
    setParfumVs((st) => pfVsCur.key === "__int"
      ? { ...st, intensity: { ...st.intensity, [pfVsSide]: v } }
      : { ...st, facets: { ...st.facets, [pfVsCur.key]: { ...st.facets?.[pfVsCur.key], [pfVsSide]: v } } });
  };
  const pfHeroActive = pfMeasureActive || pfVsHeroActive;
  const setPfHeroFromPointer = pfMeasureActive ? setPfMeasureFromPointer : setPfVsFromPointer;
  const onLineDown = (e) => {
    didHold.current = false;
    if (ratingActive) {
      // no setRatingFromPointer here anymore (see comment above) — the rating
      // only moves once onLineMove sees real travel. Hold-to-skip is armed the
      // same as before; onLineMove still cancels it the moment the pointer
      // actually travels, so a real drag never fires it, only a stationary hold.
      draggedRating.current = false;
      holdStartX.current = e && e.clientX != null ? e.clientX : 0;
      holdStart.current = Date.now();
      setHolding(true);
      holdTimer.current = setTimeout(() => {
        didHold.current = true; holdTimer.current = null;
        setHolding(false);
        finishFlow(""); // same discard as any other "done" skip — comment/rating dropped
      }, effHold);
      return;
    }
    if (pfHeroActive) {
      // même geste que ratingActive juste au-dessus — hold = discard (finishFlow("")),
      // drag = pose la valeur (voir onLineMove), tap sans drag = submitComment().
      draggedRating.current = false;
      holdStartX.current = e && e.clientX != null ? e.clientX : 0;
      holdStart.current = Date.now();
      setHolding(true);
      holdTimer.current = setTimeout(() => {
        didHold.current = true; holdTimer.current = null;
        setHolding(false);
        finishFlow("");
      }, effHold);
      return;
    }
    if (colorActive) {
      // même armement que ratingActive (hold-to-skip toujours dispo), mais le hold
      // appelle swap() — "proposal", pas "done", rien à finishFlow ici. swap() route
      // déjà vers submitParfumColor(true) (voir plus haut) : passer sans couleur.
      draggedRating.current = false;
      holdStartX.current = e && e.clientX != null ? e.clientX : 0;
      holdStart.current = Date.now();
      setHolding(true);
      holdTimer.current = setTimeout(() => {
        didHold.current = true; holdTimer.current = null;
        setHolding(false);
        swap();
      }, effHold);
      return;
    }
    if (!canHold) return;
    holdStart.current = Date.now();
    setHolding(true); // the line begins retracting toward the centre over the full hold time
    holdTimer.current = setTimeout(() => {
      didHold.current = true; holdTimer.current = null;
      setHolding(false);
      // "done" has already logged the completion (finish() pushed it the moment the
      // session ended) — there's nothing left to abandon, so a hold here just skips
      // the trailing comment/duration edit, same as tapping with an empty comment
      // would. "proposal"/"running" haven't logged anything yet, so those still
      // fully abandon via swap() (re-pick, hold cost doubles).
      if (stage === "done") finishFlow(""); else swap();
    }, effHold);
  };
  const onLineMove = (e) => {
    if (colorActive) {
      if (!draggedRating.current && e && e.clientX != null && Math.abs(e.clientX - holdStartX.current) > 8) draggedRating.current = true;
      if (draggedRating.current) setColorFromPointer(e.clientX);
      if (holdTimer.current && draggedRating.current) cancelHold();
      return;
    }
    if (pfHeroActive) {
      if (!draggedRating.current && e && e.clientX != null && Math.abs(e.clientX - holdStartX.current) > 8) draggedRating.current = true;
      if (draggedRating.current) setPfHeroFromPointer(e.clientX);
      if (holdTimer.current && draggedRating.current) cancelHold();
      return;
    }
    if (!ratingActive) return;
    // 8px is the same travel threshold used below to drop the pending hold-to-skip —
    // below it, this still reads as a stationary press (a tap in progress), so the
    // rating stays untouched; once crossed, it's a drag and every further move updates live.
    if (!draggedRating.current && e && e.clientX != null && Math.abs(e.clientX - holdStartX.current) > 8) draggedRating.current = true;
    if (draggedRating.current) setRatingFromPointer(e.clientX);
    if (holdTimer.current && draggedRating.current) cancelHold();
  };
  const cancelHold = () => { if (holdTimer.current) { clearTimeout(holdTimer.current); holdTimer.current = null; } setHolding(false); };
  const onLineUp = () => {
    if (colorActive) {
      const held = didHold.current;
      cancelHold();
      if (held) { didHold.current = false; draggedRating.current = false; return; } // skip déjà parti (swap)
      if (draggedRating.current) { draggedRating.current = false; return; } // valeur déjà posée en direct — pas d'action au relâcher
      // tap franc, sans déplacement : phase teinte → saturation, phase saturation → garder.
      if (parfumColorPhase === "hue") setParfumColorPhase("sat");
      else submitParfumColor(false);
      return;
    }
    if (pfHeroActive) {
      const held = didHold.current;
      cancelHold();
      if (held) { didHold.current = false; draggedRating.current = false; return; } // discard déjà parti
      if (draggedRating.current) { draggedRating.current = false; return; } // valeur déjà posée en direct
      if (pfMeasureActive) {
        // tap franc, sans déplacement : avance à la mesure/facette suivante (16/08-m —
        // plus de submit immédiat ici, voir pfCur dans App). Une fois pfSeq épuisée,
        // pfCur devient null et CE bloc n'est plus emprunté — la ligne retombe sur le
        // fallback générique plus bas (tapAction → submitComment sur "done").
        setParfumMIdx((i) => i + 1);
        return;
      }
      // vs (pfVsHeroActive) : même logique que les mesures (16/08-n, Maxence : "on
      // garde la même logique pour l'étape comparer") — avance dans pfVsSeq, pfVsCur
      // devient null une fois épuisée, la ligne retombe sur le fallback générique.
      setParfumVIdx((i) => i + 1);
      return;
    }
    if (ratingActive) {
      const held = didHold.current;
      cancelHold(); // clear a still-pending skip timer (a drag/short press that never held long enough)
      if (held) { didHold.current = false; draggedRating.current = false; return; } // skip already fired via the timeout above
      if (draggedRating.current) { draggedRating.current = false; return; } // value already set live by the drag — no submit yet, that's the next plain tap
      submitComment(); // no travel at all: a plain tap confirms whatever rating is currently set
      return;
    }
    const heldFor = holdStart.current ? Date.now() - holdStart.current : 0;
    cancelHold();
    if (didHold.current) { didHold.current = false; return; } // swap already fired
    if (canHold && heldFor >= 300) { holdStart.current = 0; return; } // aborted hold — spring back, no action
    holdStart.current = 0;
    tapAction();
  };
  const onLineCancel = () => { cancelHold(); didHold.current = false; draggedRating.current = false; holdStart.current = 0; };

  // ----- activity mutations -----
  const upd = (id, patch) => setActivities((arr) => arr.map((a) => (a.id === id ? { ...a, ...patch } : a)));
  const addActivity = () =>
    setActivities((arr) => [...arr, { id: uid(), name: "", domain: "creative", where: "home", target: 1, period: "week", kind: "practice", done: false, actions: [{ id: uid(), text: "", min: 15 }], items: [], stages: [], note: "" }]);
  const delActivity = (id) => setActivities((arr) => arr.filter((a) => a.id !== id));
  const addAction = (id) => upd(id, { actions: [...activities.find((a) => a.id === id).actions, { id: uid(), text: "", min: 15 }] });
  const editAction = (id, aid, patch) => upd(id, { actions: activities.find((a) => a.id === id).actions.map((ac) => (ac.id === aid ? { ...ac, ...patch } : ac)) });
  const delAction = (id, aid) => upd(id, { actions: activities.find((a) => a.id === id).actions.filter((ac) => ac.id !== aid) });
  const addStage = (id) => upd(id, { stages: [...(activities.find((a) => a.id === id).stages || []), { id: uid(), text: "" }] });
  const editStage = (id, sid, patch) => upd(id, { stages: (activities.find((a) => a.id === id).stages || []).map((s) => (s.id === sid ? { ...s, ...patch } : s)) });
  const delStage = (id, sid) => upd(id, { stages: (activities.find((a) => a.id === id).stages || []).filter((s) => s.id !== sid) });
  const moveStage = (id, sid, dir) => upd(id, { stages: (() => {
    const arr = [...(activities.find((a) => a.id === id).stages || [])];
    const i = arr.findIndex((s) => s.id === sid), j = i + dir;
    if (i < 0 || j < 0 || j >= arr.length) return arr;
    [arr[i], arr[j]] = [arr[j], arr[i]]; return arr;
  })() });
  const addItem = (id, text) => {
    if (!text.trim()) return;
    const a = activities.find((x) => x.id === id);
    // pipeline pieces enter at the first stage; balance/task items keep the todo/doing/done model
    const piece = a && a.kind === "pipeline" ? { id: uid(), text, stage: 0 } : { id: uid(), text, status: "doing" };
    upd(id, { items: [...a.items, piece] });
  };
  const cycleItem = (id, iid) => {
    const a = activities.find((x) => x.id === id);
    if (a && a.kind === "pipeline") {
      // a pipeline piece advances through the funnel stages, not todo/doing/done.
      // Tapping here is for setup/correction in the editor — in the live flow, Claude
      // advances the stage from the after-session comment (no manual tapping there).
      // Cycle includes one extra stop past the last stage: "terminé" (the same
      // graduation sentinel advanceViaClaude uses for a piece finished on its last
      // stage) — lets a piece be corrected straight to done, and triggers the same
      // graduatesTo hand-off (e.g. Piano → Répertoire) a real session would (Maxence 02/08).
      const stages = a.stages || [];
      const last = stages.length - 1;
      const n = stages.length + 1; // + terminé
      const it = a.items.find((x) => x.id === iid);
      const prevStage = it ? (it.stage ?? 0) : 0;
      const ns = (prevStage + 1) % n;
      const justGraduated = a.graduatesTo && ns > last && prevStage <= last;
      setActivities((arr) => arr.map((act) => {
        if (act.id === id) return { ...act, items: act.items.map((x) => (x.id === iid ? { ...x, stage: ns } : x)) };
        if (justGraduated && act.id === a.graduatesTo) return { ...act, items: [...(act.items || []), { id: uid(), text: it.text, status: "doing" }] };
        return act;
      }));
      return;
    }
    const order = ["todo", "doing", "done"];
    let justMastered = false;
    let items = a.items.map((it) => {
      if (it.id !== iid) return it;
      const next = order[(order.indexOf(it.status) + 1) % 3];
      if (next === "done") justMastered = true;
      return { ...it, status: next };
    });
    // mastering an item frees a rotation slot — pull the next item from the todo
    // reserve into doing so the rotation size stays constant (e.g. Chant micro's
    // ~10-song rotation backed by a todo reserve).
    if (justMastered) {
      const idx = items.findIndex((it) => it.status === "todo");
      if (idx !== -1) items = items.map((it, i) => (i === idx ? { ...it, status: "doing" } : it));
    }
    upd(id, { items });
  };
  const delItem = (id, iid) => upd(id, { items: activities.find((a) => a.id === id).items.filter((it) => it.id !== iid) });
  // free-text log for anything done outside the app — one field, one Claude call
  // resolves the intent instead of forcing every line into an activity match.
  // Replaces the old per-activity quick-log buttons (removed with the progress tab).
  // Three intents (Maxence 14/07 — the original version always forced "activity",
  // even when nothing in the catalogue actually matched; the "rapport" intent that
  // used to live here moved to its own footer button, 19/07 — see the entry
  // screen's rapport button, above where showTapHint renders):
  //   "activity" — logged exactly as before, a real "done" entry feeding the engine.
  //   "note" — anything else, kept as-is (type: "note", no activityId) rather than
  //   mis-matched to the nearest activity. Never counts toward "clics" (isClick).
  //   "start" (08/08 titre-only, généralisé 09/08 — Maxence: "pourquoi pas
  //   généraliser le asifpicked, ça me semble utile") — he's asking to BEGIN an
  //   activity NOW ("je veux faire du piano", "j'ai du temps dehors, un titre à
  //   écouter"), not describing something already done. Forces a real proposal on
  //   that activity (same resolveDraw/LRU pick as the lottery, action_id forced
  //   only if the text named one — same extraction as "activity" below) straight
  //   to the running line, only when nothing is already proposed/running (stage
  //   "entry") — never used to clobber a live pick. Reuses activity_id/action_id,
  //   no separate schema fields needed.
  const submitFreeLog = async () => {
    const text = logText.trim();
    if (!text) return;
    // debug (16/08, Maxence : "je veux tester le vs sans attendre le tirage naturel")
    // — force un cycle parfum tout neuf, prêt immédiatement au round ouverture, paire
    // choisie par le VRAI algo (pickItemsLRU, même sélection qu'en tirage normal, pas
    // fabriquée à la main) pour que le test reste représentatif. prepAcked posé direct
    // à true (saute la carte "prépare une mouillette", non pertinente pour tester
    // l'écran) ; le reste (individuel × 2 puis vs, puis avancer aux checkpoints
    // suivants) se joue ensuite normalement, y compris avec les boutons temps
    // existants (+5m/+1h/...) — aucun autre raccourci que le démarrage du cycle.
    // SIM uniquement (bac à sable), avant l'appel Claude qui suit — pas de clé requise.
    if (SIM && text.toLowerCase() === "test vs parfum") {
      const pf = activities.find((a) => a.id === "a_parfum_explo");
      const picks = pf ? pickItemsLRU(pf, log, 2) : [];
      if (pf && picks.length === 2) {
        const pf3 = {
          order: picks.map((it) => it.id), nums: picks.map((it) => it.num), names: picks.map((it) => it.text),
          prepAcked: true, prepTs: realNow().getTime(),
          round: 0, doneInRound: 0, guessed: false, guesses: [], revealed: false, cmpUpTo: 0,
        };
        const nextActivities = activities.map((a) => (a.id === "a_parfum_explo" ? { ...a, pf3 } : a));
        setActivities(nextActivities);
        const draw = pickAging(nextActivities, log, place, {});
        if (draw) { proposedAtRef.current = Date.now(); setRunning(false); setElapsedMs(0); setCurrent(draw); setStage("proposal"); }
        setMsg(draw ? "cycle test forcé" : "aucune matière disponible"); setTimeout(() => setMsg(""), 1800);
      } else {
        setMsg("a_parfum_explo introuvable ou pool insuffisant"); setTimeout(() => setMsg(""), 1800);
      }
      setLogText(""); setLogOpen(false);
      return;
    }
    const key = (await store.get("tlx_apiKey")) || "";
    if (!key) {
      // no key: can't classify freely, kept as a note rather than silently dropped
      // or force-matched without any real reading of the text.
      setLog((L) => [...L, { id: uid(), date: todayKey(), ts: realNow().getTime(), type: "note", note: text }]);
      setMsg("noté — pas de clé API pour lire plus finement"); setLogText(""); setLogOpen(false);
      setTimeout(() => setMsg(""), 2400);
      return;
    }
    setLogBusy(true);
    const catalogue = activities.map((a) => {
      const acts = (a.actions || []).map((ac) => `${ac.id}: ${ac.text}`).join(" · ") || "(pas d'action fixe)";
      return `${a.id} — ${a.name} (${a.domain}) : ${acts}`;
    }).join("\n");
    const prompt = `Tu lis ce que Maxence vient de taper dans la case "log" de BALANCE, et tu détermines son intention.

Catalogue (id — nom (domaine) : actions[id: texte]) :
${catalogue}

Ce qu'il a tapé :
« ${text} »

Détermine intent :
- "activity" si le texte décrit clairement une activité qu'il vient de faire ET qui correspond à une ligne précise du catalogue.
- "start" si le texte exprime l'envie de COMMENCER une activité du catalogue MAINTENANT (temps libre, envie de s'y mettre) plutôt que de décrire une session déjà faite — ex: "j'ai du temps dehors, un titre à écouter", "je veux faire du piano", "j'ai envie de lire", "je me lance sur du sudoku".
- "note" pour tout le reste — une pensée, un fait à garder, quelque chose de flou ou qui ne colle à aucune activité précise. Ne force JAMAIS un match approximatif : dans le doute, "note".

Si intent = "activity" ou "start" : activity_id = l'id exact du catalogue qui correspond le mieux. action_id = l'id de l'action qui correspond si le texte permet de la déduire, omets-le sinon (pour "start", l'app choisira une action par défaut). min = durée en minutes déduite du texte (intent "activity" seulement), estimation raisonnable si non précisée.
note = dans tous les cas, une ligne qui résume ce qui a été dit (sert de commentaire loggé).`;
    try {
      const out = await claudeJSON(key, prompt, {
        type: "object",
        properties: {
          intent: { type: "string", enum: ["activity", "note", "start"] },
          // structured-outputs strict mode requires every property in `required` —
          // nullable type + explicit null is how an LLM field stays optional under that
          // constraint. Omitting these from `required` was producing the http 400 on
          // submit (found 15/07: this is the only claudeJSON schema in the app with
          // optional properties not listed in `required`).
          activity_id: { type: ["string", "null"] }, action_id: { type: ["string", "null"] },
          min: { type: ["integer", "null"] }, note: { type: "string" },
        },
        required: ["intent", "activity_id", "action_id", "min", "note"],
        additionalProperties: false,
      }, 300);

      if (out.intent === "start" && stage === "entry") {
        const ta = activities.find((x) => x.id === out.activity_id);
        const forced = out.action_id ? (ta?.actions || []).find((x) => x.id === out.action_id) : null;
        const p = ta ? resolveDraw({ activity: ta, action: forced }, log) : null;
        if (p) {
          proposedAtRef.current = Date.now();
          setRunning(false); setElapsedMs(0);
          setCurrent(p); setStage("proposal");
          // same guard as propose()'s own recommandeur reco call above — a plain
          // instructional `note` field (Sudoku, Espagnol…) isn't a recommandeur.
          if (ta.kind === "recommandeur" && ta.note) {
            (async () => {
              try {
                const { title, desc } = await generateReco(key, ta, p.action, log);
                setCurrent((c) => c && c.activity.id === ta.id ? { ...c, action: { ...c.action, baseText: c.action.baseText || c.action.text, text: title, desc } } : c);
              } catch (e) {}
            })();
          }
          setLogText(""); setLogOpen(false);
          setMsg(`${ta.name} proposé`);
          return;
        }
        // no activity match / nothing resolvable — fall through and just keep it as a note below
      }
      const a = out.intent === "activity" ? activities.find((x) => x.id === out.activity_id) : null;
      if (a) {
        const action = out.action_id ? (a.actions || []).find((x) => x.id === out.action_id) : null;
        const m = Math.max(1, Math.round(out.min) || 15);
        const e = {
          id: uid(), date: todayKey(), ts: realNow().getTime(), type: "done",
          activityId: a.id, actionId: action ? action.id : null,
          actionText: action ? action.text : a.name,
          min: m, sec: m * 60, domain: a.domain, note: out.note || text,
        };
        if (a.kind === "task") setActivities((arr) => arr.map((x) => (x.id === a.id ? { ...x, done: true } : x)));
        setLog((L) => [...L, e]);
        // pipelines (Erasure/Piano/Cover/Parfum) aren't just logged — the funnel
        // piece itself needs to move, same Claude-driven read as a normal session's
        // after-finish comment (advanceViaClaude), just resolving the piece from the
        // catalogue instead of a live `current.action` (17/07, was a known gap: the
        // free-log box only ever wrote a plain "done" entry for these, funnel never moved).
        if (a.kind === "pipeline") advancePipelineFromLog(key, a, out.note || text, e.id);
        setMsg(`logged: ${e.actionText}`);
      } else {
        setLog((L) => [...L, { id: uid(), date: todayKey(), ts: realNow().getTime(), type: "note", note: out.note || text }]);
        setMsg("noté");
      }
      setLogText(""); setLogOpen(false);
    } catch (err) {
      setMsg("lecture impossible (" + (err.message || "erreur") + ")");
    } finally {
      setLogBusy(false);
      setTimeout(() => setMsg(""), 2200);
    }
  };

  // sandbox quick-complete: tick one checklist obligation. Same log shape as
  // finish(), but no timer flow — a tap (with optional minutes/comment) is enough.
  // Mirrors the real side-effects: task→done, and (sim-only, API-free) advancing
  // the pipeline funnel one stage so the drain is visible. Vaisselle no longer
  // needs a side-effect here — it's derived straight from the log.
  const simComplete = (row, min, note) => {
    const a = row.activity, action = row.action;
    const m = parseInt(min) || a.dur || (action && action.min) || 15;
    const e = {
      id: uid(), date: todayKey(), ts: realNow().getTime(), type: "done",
      activityId: a.id, actionId: action ? action.id : (a.actions[0] ? a.actions[0].id : null),
      actionText: action ? action.text : (a.actions[0] ? a.actions[0].text : a.name),
      min: m, sec: m * 60, domain: a.domain, note: (note || "").trim(),
      ...(action && action.itemId ? { itemId: action.itemId } : {}),
    };
    if (a.kind === "task") setActivities((arr) => arr.map((x) => (x.id === a.id ? { ...x, done: true } : x)));
    if (a.kind === "pipeline") {
      // advance the most-live piece one stage, or start a fresh one — so the funnel moves
      setActivities((arr) => arr.map((x) => {
        if (x.id !== a.id) return x;
        const last = (x.stages || []).length - 1;
        const pieces = (x.items || []).filter((it) => typeof it.stage === "number");
        // <= last, not < last (fixed 11/07 alongside pipelineStep/advanceViaClaude):
        // the last stage is itself a step to advance through, not an instant-done marker.
        const live = pieces.filter((p) => p.stage <= last).sort((u, v) => v.stage - u.stage);
        if (live.length) return { ...x, items: x.items.map((it) => (it.id === live[0].id ? { ...it, stage: it.stage + 1 } : it)) };
        return { ...x, items: [...(x.items || []), { id: uid(), text: e.note || "pièce " + (pieces.length + 1), stage: 0 }] };
      }));
    }
    setLog((L) => [...L, e]);
    setSimEdit(null); setSimMin(""); setSimNote("");
    simAdvanceMinutes(m); // the session took m minutes — the sim clock lives it
    setMsg(`✓ ${a.name} (+${m}m)`); setTimeout(() => setMsg(""), 1200);
  };
  // Multi-day auto-run — rewritten 11/07 (Maxence: garder l'onglet, mais qu'il
  // simule "comme si c'était fait à la main"). The old version (simWeek/
  // runSimViz) computed on a throwaway deep copy and only ever showed a stats
  // readout — it never touched the real sandbox log/activities, so "liste" and
  // "progress" told a different story than the simulateur's numbers. That
  // disconnect was the "pas fiable" complaint. This version still draws with the
  // real shipped engine (pickAging) on a working copy for correctness across the
  // run, but at the end COMMITS the result to the real sandbox state via
  // setActivities/setLog — so afterward "liste"/"progress"/"activities" show
  // exactly what a hand-run of that many sessions would have left behind.
  // Pipeline pieces advance stage-by-stage exactly like simComplete's single tap
  // (last stage included, graduates only past it — same fix as pipelineStep) —
  // no Claude call here (no comment to read), but the mechanics now agree.
  // seedActivities/seedLog let a caller run the batch against freshly-fetched
  // data instead of the current `activities`/`log` closure — needed when
  // chaining right after a reseed, since React state updates aren't visible
  // in the same synchronous continuation (stale-closure trap, caught 12/07
  // testing the balance swing: a reseed-then-runSimBatch call silently ran
  // against the OLD pre-reseed log).
  const runSimBatch = ({ days = 7, drawsPerDay = 13, seedActivities = null, seedLog = null } = {}) => {
    const acts = JSON.parse(JSON.stringify(seedActivities || activities));
    const logArr = JSON.parse(JSON.stringify(seedLog || log));
    const savedDebug = _debugDate;
    const before = logArr.length;

    // one hand-run-equivalent session: pick's activity/action, advance its
    // pipeline stage (or start a fresh piece) exactly like simComplete, push the
    // log entry. Mutates `acts`/`logArr` in place — a local working copy, not
    // yet the real state.
    const completeDraw = (row, now, dayKey) => {
      const a = acts.find((x) => x.id === row.activity.id);
      const action = row.action;
      const m = a.dur || (action && (action.dur || action.min)) || 15;
      const e = {
        id: uid(), date: dayKey, ts: now.getTime(), type: "done",
        activityId: a.id, actionId: action ? action.id : (a.actions[0] ? a.actions[0].id : null),
        actionText: action ? action.text : (a.actions[0] ? a.actions[0].text : a.name),
        min: m, sec: m * 60, domain: a.domain, note: "",
        ...(action && action.itemId ? { itemId: action.itemId } : {}),
      };
      if (a.kind === "task") a.done = true;
      if (a.kind === "pipeline") {
        const last = (a.stages || []).length - 1;
        const pieces = (a.items || []).filter((it) => typeof it.stage === "number");
        const live = pieces.filter((p) => p.stage <= last).sort((u, v) => v.stage - u.stage);
        let ns;
        if (live.length) { live[0].stage += 1; ns = live[0].stage; }
        else { a.items = [...(a.items || []), { id: uid(), text: "pièce " + (pieces.length + 1), stage: 0 }]; ns = 0; }
        e.progressed = true;
        e.finished = ns > last;
        if (e.finished && a.graduatesTo) {
          const dest = acts.find((x) => x.id === a.graduatesTo);
          if (dest) dest.items = [...(dest.items || []), { id: uid(), text: "pièce graduée", status: "doing" }];
        }
      }
      logArr.push(e);
      return m;
    };

    const runBlock = (cur, maxDraws, place) => {
      const dayKey = keyOf(cur);
      let now = new Date(cur); now.setHours(20, 0, 0, 0);
      const windowEnd = new Date(cur); windowEnd.setDate(windowEnd.getDate() + 1); windowEnd.setHours(8, 0, 0, 0);
      let guard = 0, draws = 0, lastId = null;
      while (draws < maxDraws && now < windowEnd && guard++ < 400) {
        _debugDate = fromKey(dayKey);
        _debugDate.setHours(now.getHours(), now.getMinutes(), now.getSeconds(), 0);
        let p = pickAging(acts, logArr, place, { avoidId: lastId });
        if (!p) p = pickAging(acts, logArr, place, { relax: true, avoidId: lastId });
        if (!p) { now = new Date(now.getTime() + 30 * 60000); continue; }
        const m = completeDraw(p, now, dayKey);
        draws += 1;
        lastId = p.activity.id;
        const gap = Math.floor(Math.random() * 41);
        now = new Date(now.getTime() + (m + gap) * 60000);
      }
    };

    let day = _debugDate ? new Date(_debugDate) : new Date();
    day.setHours(0, 0, 0, 0);
    const rate = drawsPerDay > 0 ? drawsPerDay : 13;
    let cumBefore = 0;
    for (let d = 0; d < days; d++) {
      const cur = new Date(day); cur.setDate(cur.getDate() + d);
      const cumAfter = Math.floor(rate * (d + 1));
      runBlock(cur, cumAfter - cumBefore, isWorkShift(new Date(cur.getFullYear(), cur.getMonth(), cur.getDate(), 21, 0, 0)) ? "work" : "home");
      cumBefore = cumAfter;
    }

    // commit — this is now the real sandbox state, same as if every draw above
    // had been a hand tap through simComplete.
    setActivities(acts); setLog(logArr);
    _debugDate = savedDebug; setClock((c) => c + 1);

    const added = logArr.slice(before);
    const acc = {}, labels = {};
    added.forEach((e) => {
      const act = acts.find((x) => x.id === e.activityId);
      const ownTarget = act && act.actions.some((x) => typeof x.target === "number");
      const key = ownTarget ? `${e.activityId}:${e.actionId}` : e.activityId;
      acc[key] = (acc[key] || 0) + 1;
      if (!labels[key]) {
        labels[key] = { activityId: e.activityId, actionId: ownTarget ? e.actionId : null,
          name: ownTarget ? `${(act || {}).name || e.activityId} — ${e.actionText}` : ((act || {}).name || e.activityId) };
      }
    });
    const rows = Object.keys(acc).map((key) => ({ key, ...labels[key], count: acc[key] })).sort((x, y) => y.count - x.count);
    setSimRes({ sessions: added.length, days, rows });
    setMsg(`${added.length} séances simulées sur ${days}j — appliquées au sandbox`); setTimeout(() => setMsg(""), 2400);
  };

  const simReseed = async () => {
    try {
      const r = await fetch("balance-catalogue.json", { cache: "no-store" });
      const c = await r.json();
      if (Array.isArray(c.activities)) { setActivities(c.activities); setLog([]); setMsg("catalogue rechargé — sandbox vidé"); }
    } catch { setMsg("balance-catalogue.json introuvable"); }
    setTimeout(() => setMsg(""), 1800);
  };

  // ----- data -----
  const exportObj = () => ({ app: "balance", version: 4, exportedAt: new Date().toISOString(), savedOn: fmtLong(todayKey()),
    activities, log });
  const exportText = () => JSON.stringify(exportObj(), null, 2);
  const download = () => {
    const blob = new Blob([exportText()], { type: "application/json" });
    const url = URL.createObjectURL(blob); const a = document.createElement("a");
    a.href = url; a.download = `balance-${stampKey()}.json`; a.click(); URL.revokeObjectURL(url);
    setMsg("file downloaded"); setTimeout(() => setMsg(""), 1800);
  };
  const copy = async () => { try { await navigator.clipboard.writeText(exportText()); setMsg("copied to clipboard"); } catch { setMsg("copy failed — use the file"); } setTimeout(() => setMsg(""), 1800); };
  // manual "out" override for today — the clock can't know you're at the
  // airport on what would otherwise be a home day (Maxence 20/07). Toggling
  // re-reads computePlace() into state immediately so anything already showing
  // `place` (not re-calling computePlace() itself) updates without waiting for
  // the next draw. No toast (Maxence: "ça distrait, ça sert à rien") — the
  // button's own label already reflects the new state instantly.
  const toggleOut = () => {
    const isOut = placeOverride() === "out";
    if (isOut) localStorage.removeItem("placeOverride");
    else localStorage.setItem("placeOverride", JSON.stringify({ place: "out", day: todayKey() }));
    setPlace(computePlace());
  };
  // Best on phones: hand the backup file to the OS share sheet (Drive, email,
  // Keep…). Falls back to a plain download where sharing files isn't supported.
  const shareBackup = async () => {
    // Share as .txt / text/plain: .json is NOT on Chrome's Web Share allowlist,
    // so canShare({files}) returns false for it and we'd silently fall to download
    // (no destination prompt). The body is still JSON; load parses by content.
    const fname = `balance-${stampKey()}.txt`;
    try {
      const file = new File([exportText()], fname, { type: "text/plain" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: "BALANCE backup" });
        setMsg("shared ✓"); setTimeout(() => setMsg(""), 1800); return;
      }
    } catch (e) { if (e && e.name === "AbortError") return; }
    download();
  };
  const applyImport = (text) => {
    try {
      const o = JSON.parse(text);
      if (!o.activities) throw new Error("no activities");
      // anti-retour-arrière (08/08, remplace le 1x/jour — voir la note sur
      // lastLoadRef) : bloque seulement si ce fichier est plus VIEUX que le
      // dernier déjà chargé aujourd'hui — comparé sur exportedAt. Pas de
      // référence encore aujourd'hui (jour changé, ou aucun load) → toujours
      // permis, exportedAt absent du fichier → impossible à vérifier, permis
      // aussi (fail open plutôt que bloquer une save légitime sans le champ).
      if (!SIM) {
        const ref = lastLoadRef.current;
        if (ref && ref.date === todayKey() && o.exportedAt && ref.exportedAt &&
            new Date(o.exportedAt).getTime() < new Date(ref.exportedAt).getTime()) {
          setMsg("ce fichier est plus ancien que le dernier chargé aujourd'hui");
          setTimeout(() => setMsg(""), 2400);
          return;
        }
      }
      // Loading mid-session (log already has entries) must never touch the log —
      // a catalogue file always carries a "log" key (even if just []), and blindly
      // importing it used to silently wipe or reintroduce stale dated history into
      // a live session, producing debts (e.g. vaisselle) that looked like a bug but
      // were really old data leaking back in (Maxence 11/07).
      // But when the live log is empty (fresh session — e.g. recovering after a
      // lost session), a real backup file's log should come back too, or "load"
      // can never actually restore history (Maxence 13/07).
      setActivities(o.activities);
      if (log.length === 0 && Array.isArray(o.log) && o.log.length > 0) setLog(o.log);
      if (o.exportedAt) {
        lastLoadRef.current = { date: todayKey(), exportedAt: o.exportedAt };
        store.set(NS("tlx_lastLoadRef"), JSON.stringify(lastLoadRef.current));
      }
      setMsg("loaded ✓"); setTab("now"); setStage("entry");
    } catch { setMsg("couldn't read that — check the file/text"); }
    setTimeout(() => setMsg(""), 2200);
  };
  const onFile = (ev) => {
    const f = ev.target.files?.[0]; if (!f) return;
    const r = new FileReader(); r.onload = () => applyImport(String(r.result)); r.readAsText(f); ev.target.value = "";
  };
  // undo a bad tap (Maxence 25/07: logged Erasure as done, hadn't actually written
  // anything — no way to fix it except editing the raw save file by hand). Lives
  // only on the "done" screen (see stage === "done" render below) — gone the moment
  // the flow returns to the waiting screen, by design (M. 25/07: not a standing
  // fixture on the entry screen, just a way to catch a mistake before it's final).
  // Reverts the pipeline move too if one already happened (advanceViaClaude), via
  // the snapshot finish() takes in pipelineUndoRef before logging the session.
  const undoLast = () => {
    if (!doneEntryId || !current) return;
    const id = doneEntryId, act = current.activity;
    cancelledEntryIdsRef.current.add(id);
    setLog((L) => L.filter((en) => en.id !== id && en.parentId !== id));
    if (act.kind === "task") {
      setActivities((arr) => arr.map((a) => (a.id === act.id ? { ...a, done: false } : a)));
    }
    const snap = pipelineUndoRef.current;
    if (snap && snap.entryId === id) {
      setActivities((arr) => arr.map((a) => {
        if (a.id === snap.aid) return { ...a, items: snap.prevItems };
        if (snap.graduatesTo && a.id === snap.graduatesTo) return { ...a, items: snap.prevGraduateItems };
        return a;
      }));
      pipelineUndoRef.current = null;
    }
    resetFlow("entry");
    setMsg("annulé"); setTimeout(() => setMsg(""), 1500);
  };
  const resetAll = () => {
    if (typeof window !== "undefined" && !window.confirm("wipe all activities and history?")) return;
    // a real reset means real zero — a debug date left jumped ahead used to survive
    // this, so post-reset taps kept logging under a stale simulated clock, making
    // it look like old data hadn't actually gone away (Maxence 11/07).
    clockReal();
    setActivities(SEED); setLog([]);
    setStage("entry"); setCurrent(null); setLastId(null);
    setHoldMs(BASE_HOLD_MS); setHoldDate(todayKey());
    setSimRes(null);
