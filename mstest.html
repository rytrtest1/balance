<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>MediaSession minimal repro</title>
<style>
  body { font-family: sans-serif; background: #111; color: #eee; padding: 24px; }
  button { font-size: 20px; padding: 16px 24px; margin: 8px 0; display: block; width: 100%; }
  #log { white-space: pre-wrap; font-family: monospace; font-size: 12px; background: #000; padding: 8px; margin-top: 16px; max-height: 50vh; overflow-y: auto; }
</style>
</head>
<body>
<h1>MediaSession minimal repro</h1>
<button id="startBtn">Start</button>
<button id="stopBtn">Stop</button>
<div id="log"></div>

<audio id="silent" src="./silence.wav" loop preload="auto"></audio>

<script>
const logEl = document.getElementById("log");
function log(msg) {
  const line = `[${new Date().toISOString().split("T")[1].slice(0,12)}] ${msg}`;
  console.log(line);
  logEl.textContent += line + "\n";
  logEl.scrollTop = logEl.scrollHeight;
}

window.addEventListener("error", (e) => {
  log("WINDOW ERROR: " + e.message + " @ " + e.filename + ":" + e.lineno);
});
window.addEventListener("unhandledrejection", (e) => {
  log("UNHANDLED REJECTION: " + e.reason);
});
log("script start, readyState=" + document.readyState);

const audio = document.getElementById("silent");
log("audio element found: " + !!audio);
audio.addEventListener("ended", () => {
  log("audio ended -> manual restart");
  audio.currentTime = 0;
  audio.play().catch((e) => log("restart play() failed: " + e));
});
audio.addEventListener("play", () => log("audio: play event"));
audio.addEventListener("pause", () => log("audio: pause event"));
audio.addEventListener("error", (e) => log("audio: error " + JSON.stringify(audio.error)));

document.addEventListener("visibilitychange", () => {
  log("visibilitychange -> " + document.visibilityState);
});

if (!("mediaSession" in navigator)) {
  log("navigator.mediaSession NOT AVAILABLE");
} else {
  log("navigator.mediaSession available");
}

const startBtn = document.getElementById("startBtn");
log("startBtn found: " + !!startBtn);
startBtn.addEventListener("click", () => {
  log("startBtn CLICKED");
  try {
    audio.play()
      .then(() => log("audio.play() resolved"))
      .catch((e) => log("audio.play() rejected: " + e));

    if ("mediaSession" in navigator) {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: "Test action",
        artist: "Test activity",
        album: "BALANCE minimal repro",
        artwork: [
          { src: "./icon-192.png", sizes: "192x192", type: "image/png" },
          { src: "./icon-512.png", sizes: "512x512", type: "image/png" },
        ],
      });
      navigator.mediaSession.playbackState = "playing";
      navigator.mediaSession.setActionHandler("play", () => {
        log("action handler: play");
        audio.play();
        navigator.mediaSession.playbackState = "playing";
      });
      navigator.mediaSession.setActionHandler("pause", () => {
        log("action handler: pause");
        audio.pause();
        navigator.mediaSession.playbackState = "paused";
      });
      log("mediaSession metadata + handlers set, playbackState=playing");
    }
  } catch (err) {
    log("SYNC THROW in click handler: " + err.message);
  }
});

const stopBtn = document.getElementById("stopBtn");
log("stopBtn found: " + !!stopBtn);
stopBtn.addEventListener("click", () => {
  log("stopBtn CLICKED");
  audio.pause();
  if ("mediaSession" in navigator) {
    navigator.mediaSession.playbackState = "paused";
  }
  log("stopped");
});

log("script fully executed, all listeners registered");
</script>
</body>
</html>
